<html>
	<script>
		class Node{
			constructor(val){
				this.left=null;
				this.val=val;
				this.right=null;
			}
		}
		class NodeList{
			constructor(){
				this.head=null;
			}
			addNode(val){
				const n1=new Node(val);
				if(this.head==null){
					this.head=n1;
					console.log("inserted=",n1.val);
					return;
				}
				
				let queue=[this.head];
				while(queue.length>0){
					let temp=queue.shift();
					if(temp.left==null){
						temp.left=n1;
						console.log("inserted=",n1.val);
						return;
					}
					else{
						queue.push(temp.left);
						
					}
					if(temp.right==null){
						temp.right=n1;
						console.log("inserted=",n1.val);
						return;
					}
					else{
						queue.push(temp.right);
						
					}
				}				
			}
			viewNode(){
				if(this.head==null){
					console.log("empty list");
					return;
				}
				else{
					let queue=[this.head];
					let finals=[];
					function traverse(){
					if(queue.length==0) return ;
							
						let temp=queue.shift();						
						finals.push(temp.val);
						if(temp.left) queue.push(temp.left)
						if(temp.right) queue.push(temp.right)
						traverse()
					}
					traverse()
					console.log("bfs=",finals)
				}				
			}
		}
		const list=new NodeList();
		list.addNode(30);
		list.addNode(20);
		list.addNode(10);
		list.addNode(40);
		list.addNode(50);
		list.viewNode();
	</script>
</html>
