<html>
	<script>
		console.log("detect cycle");
	function cycledetect(graph, start) {
  const parent = {};
  const visited = new Set();
  const pq = [];

  pq.push(start);
  parent[start] = null;

  while (pq.length > 0) {
    const current = pq.shift();
    visited.add(current);

    for (const neighbor of graph[current]) {
      if (!visited.has(neighbor)) {
        parent[neighbor] = current;
        pq.push(neighbor);
      } else if (parent[current] !== neighbor) {
        // This is a real cycle
        console.log("cycle found");
        return true;
      }
    }
  }

  console.log("no cycle found");
  return false;
}

const graph={
	A:['B'],
	B:['C'],
	C:['A'],
}
cycledetect(graph,'A');
	</script>
