<html>
<script>
function hasCycleDFS(node, parent, visited, graph) {
  visited.add(node);

  for (const neighbor of graph[node]) {
    if (!visited.has(neighbor)) {
      if (hasCycleDFS(neighbor, node, visited, graph)) {
        return true;
      }
    } else if (neighbor !== parent) {
      return true;
    }
  }

  return false;
}

function detectCycle(graph) {
  const visited = new Set();

  for (const node in graph) {
    if (!visited.has(node)) {
      if (hasCycleDFS(node, null, visited, graph)) {
        console.log("Cycle found");
        return true;
      }
    }
  }

  console.log("No cycle found");
  return false;
}

const bstGraph = {
  4: [2, 6],
  2: [4, 1, 3],
  6: [4, 5, 7],
  1: [2],
  3: [2],
  5: [6],
  7: [6]
};

detectCycle(bstGraph);
</script>

</html>
