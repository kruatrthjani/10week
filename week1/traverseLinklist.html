<html>
	<script>
		class Node{
			constructor(value){
				this.value=value;
				this.next=null;
			}
		}
		
		class LinkList{
			constructor(){
				this.head=null;
			}
			append(value){
				const newNode=new Node(value); 
				
				if(this.head==null){
					this.head=newNode;					
					
				}
			else{
				let current=this.head;
					while(current.next!=null){
							current=current.next;
						}
						current.next=newNode;
												
				}		
				}
				
			insertatBegain(value){
				const n1=new Node(value);
				if(this.head==null){
					this.head=n1;
					
				}
				console.log("asd=",this.head);
				let temp=this.head;
				
				this.head=n1;
				n1.next=temp;
							
			}
			
			insertAtEnd(value){
				const n1 =new Node(value);
				if(this.head==null){
					this.head=n1;
				}
				else{
					let current=this.head;
					while(current.next!=null){
						current=current.next;
					}
					current.next=n1;
				}
			}
			
			deleteAtEnd(){
				if(this.head==null){
					console.log("this is empty");
				}
				else{
					let current=this.head;
					while(current.next.next!==null)
					{
						current=current.next;
					}
					current.next=null;
				}
					
			}
			
			deleteAtBegain(){
				if(this.head==null){
					console.log("it is null");
				}
				else{
					let current=this.head;
					current=current.next;
					this.head=current;
				}
					
			}
			traverse(){
				let current=this.head;
				
				while(current!=null)
					{
						console.log("node=",current.value)
						current=current.next					
					}				
					
				}
		}
		
		const List=new LinkList();
		List.append(10);
		List.append(20);
		List.append(30);
		List.insertatBegain(5);
		List.insertAtEnd(35);
		List.deleteAtEnd();
		List.deleteAtBegain();
		List.traverse();
	</script>
