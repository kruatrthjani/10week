<body>
  <script>
    const arr = Array.from({ length: 1001 }, (_, i) => i);  // [0, 1, 2, ..., 1000]

    function binarySearch(key) {
      let start = 0;
      let end = arr.length - 1;      
      let mid = Math.floor((start + end) / 2);
      // Artificial iteration limit
      while (start<=end) {
        mid = Math.floor((start + end) / 2)
		
        if (arr[mid] === key) {
          return mid;
          return;
        } else if (key > arr[mid]) {
          start = mid + 1;
          
        } else if (key < arr[mid]) {
          end = mid - 1;
          
        }       
      }
		return-1
      console.log("Element not found");
    }

    const output=binarySearch(100); // ✅ EXISTS at the last index
	console.log(output==-1?"element not found":`element found at ${output}`);
  </script>
</body>
