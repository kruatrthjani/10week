<html>
<script>
function dijkstra(graph, start) {
    const distances = {};
    const visited = new Set();
    const pq = []; // priority queue (simple array for now)

    // Initialize distances
    for (let node in graph) {
        distances[node] = Infinity;
    }
    distances[start] = 0;
    pq.push({ node: start, dist: 0 });

    while (pq.length > 0) {
        // Pick the node with the smallest distance
        pq.sort((a, b) => a.dist - b.dist);
        const { node: currentNode, dist: currentDist } = pq.shift();

        if (visited.has(currentNode)) continue;
        visited.add(currentNode);


        // Check neighbors
        for (let neighbor in graph[currentNode]) {
		console.log("neighbour=",neighbor);
            const weight = graph[currentNode][neighbor];
            const newDist = currentDist + weight;

            if (newDist < distances[neighbor]) {
                distances[neighbor] = newDist;
                pq.push({ node: neighbor, dist: newDist });
            }
        }
    }

    return distances;
}

// Example graph
const graph = {
    A: { B: 4, C: 2 },
    B: { A: 4, C: 5, D: 10 },
    C: { A: 2, B: 5, D: 3, E: 4 },
    D: { B: 10, C: 3, E: 1, F: 6 },
    E: { C: 4, D: 1, F: 2 },
    F: { D: 6, E: 2 }
};

// Test from node 'D'
console.log(dijkstra(graph, 'D'));
// Expected Output:
// { A: 5, B: 8, C: 3, D: 0, E: 1, F: 3 }
</script>
